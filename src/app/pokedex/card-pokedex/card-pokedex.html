<div class="card">
  
  <div class="grid">


    
    
<b>{{id}}</b>
    <img *ngIf="spriteUrl" [src]="spriteUrl" [alt]="name" class="pokemon-sprite" />
    <b> {{ name | titlecase }}</b>
    
    <div class="types">
      <span *ngFor="let t of types"
            [style.background]="t.color"
            class="type-badge">
        {{ t.type }}
      </span>
    </div>
  </div>
</div>

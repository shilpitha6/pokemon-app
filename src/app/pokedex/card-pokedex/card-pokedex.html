<div class="card" *ngIf="pokemonTypes$ | async as pokemon">

  <b>{{ id }}</b>

  <img 

    [src]="pokemon.spriteUrl"
    [alt]="name"
    class="pokemon-sprite"
  />

  <b>{{ name | titlecase }}</b>

  <div class="types" [ngClass]="pokemon.types.length > 1 ? 'double' : 'single'">
    <span 
      *ngFor="let type of pokemon.types"
      class="type-badge"
      [ngClass]="'type-' + type"
    >
      {{ type }}
    </span>
  </div>

</div>

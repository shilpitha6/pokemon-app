<div class="card" *ngIf="pokemonTypes$ | async as pokemon">

  <b>{{ id }}</b>

  <img 
    *ngIf="pokemon.spriteUrl"
    [src]="pokemon.spriteUrl"
    [alt]="name"
    class="pokemon-sprite"
  />

  <b>{{ name | titlecase }}</b>

  <div class="types" [ngClass]="pokemon.types.length === 1 ? 'single' : 'double'">
    <span 
      *ngFor="let t of pokemon.types"
      [style.background]="t.color"
      class="type-badge"
    >
      {{ t.type }}
    </span>
  </div>

</div>
